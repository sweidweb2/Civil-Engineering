# Production stack (Hostinger VPS).
# Usage:
#   docker compose -f docker-compose.production.yml up -d --build
#
# Loads secrets/config from backend/.env.production (inject real secrets on the host).
# Redis is skipped for now.
# Prefer binding only via Nginx (infrastructure/nginx/) once that config exists.
# Do not commit real production secrets.

name: civil-engineering-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: civil-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-civil}
    volumes:
      - civil_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-civil}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - civil_prod_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civil-prod-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      # Inside Docker, DB host is the Compose service name — not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-civil}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civil_prod_net

  web:
    build:
      context: ./civil-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: civil-prod-web
    restart: unless-stopped
    # Interim public port until infrastructure/nginx is the sole entry
    ports:
      - '${WEB_PUBLISH_PORT:-80}:80'
    depends_on:
      - api
    networks:
      - civil_prod_net

volumes:
  civil_prod_postgres_data:

networks:
  civil_prod_net:
    driver: bridge
