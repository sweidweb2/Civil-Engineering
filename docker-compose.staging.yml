# Staging stack (Hostinger / staging host).
# Usage:
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Loads secrets/config from backend/.env.staging (replace CHANGE_ME values first).
# Redis is skipped for now.
# Nginx edge config still TBD (infrastructure/nginx/).

name: civil-engineering-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: civil-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-civil}
    volumes:
      - civil_staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civil}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - civil_staging_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civil-staging-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    environment:
      # Inside Docker, DB host is the Compose service name — not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-civil}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civil_staging_net

  web:
    build:
      context: ./civil-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: civil-staging-web
    restart: unless-stopped
    ports:
      - '${WEB_PUBLISH_PORT:-8080}:80'
    depends_on:
      - api
    networks:
      - civil_staging_net

volumes:
  civil_staging_postgres_data:

networks:
  civil_staging_net:
    driver: bridge
