# Production overrides for Hostinger VPS.
# Usage (when Redis / full stack is wired):
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Today local Compose only defines Postgres. Uncomment matching services in
# docker-compose.yml (api, web, redis) before relying on this override file,
# or expand this file into a full production stack when deploying.
#
# Add infrastructure/nginx/ when real Nginx config is ready — Nginx is the sole public entry.
# Do not commit secrets; inject via Hostinger env / untracked .env / secrets store.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-civil}

