# Local development Compose — monorepo root.
# Decision: Docs/[3] Decisions/[4] Docker & Infrastructure.md
# Do not commit secrets; override via env_file / host environment.
#
# For day-to-day coding: start Postgres only, run API + web with npm on your machine.
# Redis / containerized API / web are optional later (commented below).

name: civil-engineering

services:
  postgres:
    image: postgres:16-alpine
    container_name: civil-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-civil}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - civil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civil}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - civil_net

